[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ciutil"
version = "1.0.0"
description = "CRC-32, Adler-32, Base64, Roman numeral and SemVer utilities with a small CLI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ciutil = "ciutil.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "hypothesis>=6.150",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ciutil"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
