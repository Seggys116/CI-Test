name: bun
run-name: bun (runners=${{ inputs.runners }}, os=${{ inputs.os }})

on:
  workflow_dispatch:
    inputs:
      runners:
        description: runner set to use
        type: choice
        options:
          - all
          - github-hosted
          - unified
        default: all
      os:
        description: restrict to one operating system
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
        default: all
      artifacts:
        description: upload the built cli as an artifact
        type: boolean
        default: false
  workflow_call:
    inputs:
      runners:
        type: string
        default: all
      os:
        type: string
        default: all
      artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runners:
    uses: ./.github/workflows/_runners.yml
    with:
      runners: ${{ inputs.runners }}
      os: ${{ inputs.os }}
      exclude: ""

  test:
    name: ${{ matrix.target.runner }} / bun ${{ matrix.bun }}
    needs: runners
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: projects/bun
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.runners.outputs.matrix) }}
        bun:
          - 1.4.x
          - latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/runner-info
        with:
          label: ${{ matrix.target.runner }}
          tools: "bun"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: format
        run: bun run format:check

      - name: test
        run: bun test

      - name: build standalone executable
        run: bun run build

      - name: cli smoke (compiled)
        run: bash ../../scripts/cli-smoke.sh dist/ciutil

      - name: cli smoke (interpreted)
        run: bash ../../scripts/cli-smoke.sh bun src/bin.ts

      - name: upload cli
        if: ${{ inputs.artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: bun-cli-${{ matrix.target.runner }}-${{ matrix.bun }}
          path: projects/bun/dist
          if-no-files-found: error
          retention-days: 3
