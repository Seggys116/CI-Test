name: dotnet
run-name: dotnet (runners=${{ inputs.runners }}, os=${{ inputs.os }})

on:
  workflow_dispatch:
    inputs:
      runners:
        description: runner set to use
        type: choice
        options:
          - all
          - github-hosted
          - unified
        default: all
      os:
        description: restrict to one operating system
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
        default: all
      artifacts:
        description: upload the built cli as an artifact
        type: boolean
        default: false
  workflow_call:
    inputs:
      runners:
        type: string
        default: all
      os:
        type: string
        default: all
      artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runners:
    uses: ./.github/workflows/_runners.yml
    with:
      runners: ${{ inputs.runners }}
      os: ${{ inputs.os }}
      exclude: ""

  test:
    name: ${{ matrix.target.runner }}
    needs: runners
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: projects/dotnet
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.runners.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/runner-info
        with:
          label: ${{ matrix.target.runner }}
          tools: "dotnet"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: projects/dotnet/global.json

      - name: restore
        run: dotnet restore CiUtil.slnx

      - name: format
        run: dotnet format CiUtil.slnx --verify-no-changes --no-restore

      - name: build
        run: dotnet build CiUtil.slnx -c Release --no-restore

      - name: test
        run: dotnet test CiUtil.slnx -c Release --no-build

      - name: cli smoke
        run: bash ../../scripts/cli-smoke.sh dotnet src/CiUtil.Cli/bin/Release/net10.0/ciutil.dll

      - name: upload cli
        if: ${{ inputs.artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-cli-${{ matrix.target.runner }}
          path: projects/dotnet/src/CiUtil.Cli/bin/Release
          if-no-files-found: error
          retention-days: 3
