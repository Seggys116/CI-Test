name: pnpm
run-name: pnpm (runners=${{ inputs.runners }}, os=${{ inputs.os }})

on:
  workflow_dispatch:
    inputs:
      runners:
        description: runner set to use
        type: choice
        options:
          - all
          - github-hosted
          - unified
        default: all
      os:
        description: restrict to one operating system
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
        default: all
      artifacts:
        description: upload the built cli as an artifact
        type: boolean
        default: false
  workflow_call:
    inputs:
      runners:
        type: string
        default: all
      os:
        type: string
        default: all
      artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runners:
    uses: ./.github/workflows/_runners.yml
    with:
      runners: ${{ inputs.runners }}
      os: ${{ inputs.os }}
      exclude: ""

  test:
    name: ${{ matrix.target.runner }} / node ${{ matrix.node }}
    needs: runners
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: projects/pnpm
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.runners.outputs.matrix) }}
        node:
          - 22
          - 24
          - 26
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/runner-info
        with:
          label: ${{ matrix.target.runner }}
          tools: "node pnpm"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: projects/pnpm/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: projects/pnpm/pnpm-lock.yaml

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: format
        run: pnpm run format:check

      - name: test
        run: pnpm test

      - name: build
        run: pnpm run build

      - name: cli smoke
        run: bash ../../scripts/cli-smoke.sh node packages/cli/dist/bin.js

      - name: upload cli
        if: ${{ inputs.artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-cli-${{ matrix.target.runner }}-node${{ matrix.node }}
          path: projects/pnpm/packages/*/dist
          if-no-files-found: error
          retention-days: 3
