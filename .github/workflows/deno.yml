name: deno
run-name: deno (runners=${{ inputs.runners }}, os=${{ inputs.os }})

on:
  workflow_dispatch:
    inputs:
      runners:
        description: runner set to use
        type: choice
        options:
          - all
          - github-hosted
          - unified
        default: all
      os:
        description: restrict to one operating system
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
        default: all
      artifacts:
        description: upload the built cli as an artifact
        type: boolean
        default: false
  workflow_call:
    inputs:
      runners:
        type: string
        default: all
      os:
        type: string
        default: all
      artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runners:
    uses: ./.github/workflows/_runners.yml
    with:
      runners: ${{ inputs.runners }}
      os: ${{ inputs.os }}
      exclude: ""

  test:
    name: ${{ matrix.target.runner }} / deno ${{ matrix.deno }}
    needs: runners
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: projects/deno
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.runners.outputs.matrix) }}
        deno:
          - v2.x
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/runner-info
        with:
          label: ${{ matrix.target.runner }}
          tools: "deno"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}

      - name: format
        run: deno task fmt-check

      - name: lint
        run: deno task lint

      - name: typecheck
        run: deno check src/main.ts

      - name: test
        run: deno task test

      - name: build standalone executable
        run: deno task compile

      - name: cli smoke (compiled)
        run: bash ../../scripts/cli-smoke.sh dist/ciutil

      - name: upload cli
        if: ${{ inputs.artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: deno-cli-${{ matrix.target.runner }}-${{ matrix.deno }}
          path: projects/deno/dist
          if-no-files-found: error
          retention-days: 3
