name: zig
run-name: zig (runners=${{ inputs.runners }}, os=${{ inputs.os }})

on:
  workflow_dispatch:
    inputs:
      runners:
        description: runner set to use
        type: choice
        options:
          - all
          - github-hosted
          - unified
        default: all
      os:
        description: restrict to one operating system
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
        default: all
      artifacts:
        description: upload the built cli as an artifact
        type: boolean
        default: false
  workflow_call:
    inputs:
      runners:
        type: string
        default: all
      os:
        type: string
        default: all
      artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runners:
    uses: ./.github/workflows/_runners.yml
    with:
      runners: ${{ inputs.runners }}
      os: ${{ inputs.os }}
      exclude: ""

  test:
    name: ${{ matrix.target.runner }} / zig ${{ matrix.zig }}
    needs: runners
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: projects/zig
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.runners.outputs.matrix) }}
        zig:
          - 0.16.0
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/runner-info
        with:
          label: ${{ matrix.target.runner }}
          tools: "zig"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: format
        run: zig fmt --check .

      - name: test
        run: zig build test --summary all

      - name: build (debug)
        run: zig build

      - name: build (release safe)
        run: zig build -Doptimize=ReleaseSafe

      - name: cli smoke
        run: bash ../../scripts/cli-smoke.sh zig-out/bin/ciutil

      - name: upload cli
        if: ${{ inputs.artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: zig-cli-${{ matrix.target.runner }}-${{ matrix.zig }}
          path: projects/zig/zig-out/bin
          if-no-files-found: error
          retention-days: 3
